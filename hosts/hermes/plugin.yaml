# The manifest the hermes loader sees in the SYMLINK development install
# (~/.hermes/plugins/memories -> this directory). The git install reads the root
# plugin.yaml instead. The `version:` is a COPY of `core/version.py`, which owns the
# number -- see the root plugin.yaml for why that is safe, and
# tests/test_installable_from_git.py::TestTheVersionIsONENumber for what enforces it.
# tests/test_hermes_provider.py pins the three keys the loader reads.
name: memories
version: 1.0.0
description: "Long-term semantic memory with automatic recall, plus indexes for long documents and for git repositories, on top of Qdrant. Shares its archives with the claude-code plugin."
category: memory
kind: exclusive
license: MIT
homepage: https://github.com/erickstryck/memories-plugin
